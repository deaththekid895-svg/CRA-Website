<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Central Records Authority</title>

    <meta
        name="description"
        content="Central Records Authority — Infernal Information Network."
    >

    <link rel="stylesheet" href="CSS/terminal.css">
</head>

<body>

    <!--
        CENTRAL RECORDS AUTHORITY
        INFERNAL INFORMATION NETWORK

        Fictional interactive artifact.
        All records are procedurally generated.
        No real persons, records, credentials, or restricted data are used.
    -->

    <main id="terminal" aria-label="Central Records Authority terminal">

        <div id="screen"></div>

        <form id="command-form" autocomplete="off">

            <span class="prompt">&gt;</span>

            <input
                id="command-input"
                type="text"
                aria-label="Terminal command"
                spellcheck="false"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="characters"
            >

        </form>

    </main>

    <script src="js/database.js"></script>
    <script src="js/terminal.js"></script>

</body>
</html>
